      window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var rocket = document.createElement('div');
  rocket.id = 'mini-rocket';
  rocket.textContent = '🚀';
  rocket.style.display = 'none';
  document.body.appendChild(rocket);

  var tx = 0, ty = 0, x = 0, y = 0, angle = 0, seen = false, lastSpark = 0;
  var OFFSET = 18; // keep rocket slightly away from the cursor

  document.addEventListener('mousemove', function (e) {
    tx = e.clientX; ty = e.clientY;
    if (!seen) { x = tx; y = ty; seen = true; rocket.style.display = ''; }
  });
  document.addEventListener('mouseleave', function () { rocket.style.display = 'none'; seen = false; });

  function spark(px, py, heading) {
    var s = document.createElement('div');
    s.className = 'mini-rocket-spark';
    s.style.left = px + 'px'; s.style.top = py + 'px';
    s.style.setProperty('--dx', (-Math.cos(heading) * 14) + 'px');
    s.style.setProperty('--dy', (-Math.sin(heading) * 14) + 'px');
    document.body.appendChild(s);
    setTimeout(function () { s.remove(); }, 500);
  }

  function frame(t) {
    if (seen) {
      var dx = tx - x, dy = ty - y, dist = Math.hypot(dx, dy);
      x += dx * 0.12; y += dy * 0.12;
      if (dist > 4) {
        var heading = Math.atan2(dy, dx);
        // the emoji points up-right (-45deg), so add 45deg to align it with the heading
        var target = heading * 180 / Math.PI + 45;
        var diff = ((target - angle + 540) % 360) - 180; // shortest turn
        angle += diff * 0.2;
        if (dist > 30 && t - lastSpark > 40) {
          lastSpark = t;
          spark(x - Math.cos(heading) * 14, y - Math.sin(heading) * 14, heading);
        }
      }
      rocket.style.transform =
        'translate(' + (x + OFFSET) + 'px,' + (y + OFFSET) + 'px) translate(-50%,-50%) rotate(' + angle + 'deg)';
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();</script></body></html>
